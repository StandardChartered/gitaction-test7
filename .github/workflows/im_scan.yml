name: IM availability scan
on:
  push:
    branches: [tmp/im-availability-scan-20260717b]
    paths:
      - scripts/im_scan.py
      - .github/workflows/im_scan.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/im-availability-scan-20260717b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan official WHOIS
        run: python scripts/im_scan.py
      - name: Commit immutable results
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results || true
          git commit -m "Save verified three-letter .im scan results" || true
          git push origin HEAD:tmp/im-availability-scan-20260717b
